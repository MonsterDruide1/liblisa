[package]
name = "liblisa-diff"
version = "0.1.0"
edition = "2021"
description = "A tool for automated diffing of the ISA of Ghidra vs. x86 through QEMU."
license = "AGPL-3.0-only"
documentation = "https://docs.liblisa.nl/"
homepage = "https://liblisa.nl/"
repository = "https://github.com/liblisa/liblisa"

[features]
default = ["nolog"]
nolog = ["log/release_max_level_off"]

[dependencies]
env_logger = "0.10"
liblisa-libcli = { version = "0.1.0", path = "../../cli/liblisa-libcli" }
liblisa = { version = "0.1.0", path = "../../liblisa" }
liblisa-ghidra-x64-observer = { version = "0.1.0", path = "../../arch/ghidra-x64/liblisa-ghidra-x64-observer" }
liblisa-x64-observer = { version = "0.1.0", path = "../../arch/x64/liblisa-x64-observer" }
liblisa-enc = { version = "0.1.0", path = "../../liblisa-enc" }
clap = { version = "4.4.8", features = ["derive"] }
log = "0.4.0"
serde_json = "1.0"
serde = { version = "1.0", features = [ "derive" ] }
rand = "0.8"
rand_xoshiro = "0.6"
nix = { version = "0.27.1", features = ["process", "ptrace", "signal", "sched"] }
thiserror = "1"

[dev-dependencies]
test-log = "0.2.10"
